name: daily-311
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: restore previous raw data
        run: |
          if git fetch origin rawdata --depth=1; then
            git restore --source=FETCH_HEAD --worktree -- data/raw
          fi
      - run: python fetch.py
      - run: python fetch_raw.py
      - name: commit aggregated data to main
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --quiet || git commit -m "daily update"
          git push
      - name: publish raw data to rawdata branch
        run: |
          git checkout --orphan rawdata_new
          git rm -r -q --cached .
          git add data/raw
          git commit -m "raw snapshot"
          git push -f origin rawdata_new:rawdata
